name: Flutter CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  check:
    name: Analyze and Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed .
      - run: flutter analyze
      - run: flutter test
      - run: flutter pub publish --dry-run

  build-ios:
    name: Build example (${{ matrix.integration }})
    runs-on: macos-latest
    strategy:
      matrix:
        integration: [swift-package-manager, cocoapods]
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - if: matrix.integration == 'swift-package-manager'
        run: flutter config --enable-swift-package-manager
      - if: matrix.integration == 'cocoapods'
        run: flutter config --no-enable-swift-package-manager
      - working-directory: example
        run: flutter build ios --simulator --debug
