name: storekit_external_purchase
description: "Apple StoreKit External Purchase Custom Link APIs for Flutter: eligibility, the system disclosure notice and External Purchase Server API tokens. iOS only."
version: 0.1.0
repository: https://github.com/Fullphysio/storekit_external_purchase
issue_tracker: https://github.com/Fullphysio/storekit_external_purchase/issues
topics:
  - storekit
  - in-app-purchase
  - payments
  - ios

environment:
  sdk: ^3.9.0
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  plugin_platform_interface: ^2.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      ios:
        pluginClass: StorekitExternalPurchasePlugin
